<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Essai du lecteur des publications</title>
<style>body{font:16px system-ui;margin:32px auto;padding:0 20px;max-width:900px;background:#faf7f1;color:#153b47}input{width:90%;padding:10px}button{padding:12px;cursor:pointer}.cockpit-media-gallery{display:flex;gap:20px}.cockpit-media-card{width:360px;border:1px solid #ccc}.cockpit-video-screen{position:relative;width:100%;aspect-ratio:var(--video-ratio);max-height:520px;min-height:220px;background:#102f39}.cockpit-video-screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.cockpit-video-launch{position:absolute;inset:0;width:100%;background:#102f39;color:white}.cockpit-video-play{font-size:40px;display:block}.cockpit-video-close[hidden]{display:none}.cockpit-video-help{font-size:12px;padding:10px}</style>
<h1>Lecteur des publications</h1><p>Essai synthétique sans accès à la base du cockpit. Seul le lecteur utilise le fichier SharePoint indiqué.</p>
<form><label>Lien de la vidéo SharePoint <input name="video" type="url" required></label><button>Afficher la fiche d’essai</button></form><hr><div class="cockpit-media-gallery" data-media-gallery></div>
<script type="module">
import {sharePointVideoMarkup,setupSharePointVideos,setupSharePointVideoLifecycle,patchVideoGallery} from './sharepoint-video.mjs';
const gallery=document.querySelector('[data-media-gallery]');setupSharePointVideos(gallery);setupSharePointVideoLifecycle(document);
document.querySelector('form').addEventListener('submit',event=>{event.preventDefault();const row={kind:'video',url:new FormData(event.target).get('video'),label:'Vidéo d’essai SharePoint',previewDataWidth:720,previewDataHeight:1280};const media=sharePointVideoMarkup(row);patchVideoGallery(gallery,media?`<article class="cockpit-media-card" data-media-id="test">${media}<p>Confirmation indépendante du lecteur.</p></article>`:'<p>Lien vidéo non reconnu.</p>');});
</script></html>
