<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#073a52">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>try{const t=localStorage.getItem("bleu-massawippi-theme");document.documentElement.dataset.theme=t==="dark"||t==="light"?t:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch{}</script>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/brand/cockpit-bleu-massawippi-icon-192.png">
  <link rel="stylesheet" href="./clarity.css?v=20260823-b65">
  <link rel="stylesheet" href="./project-calendar.css?v=20260823-b65">
  <title>Cockpit Communication Bleu Massawippi</title>
</head>
<body>
  <a class="cockpit-skip-link" href="#cockpit-content">Aller au contenu principal</a>
  <main id="cockpit-content" tabindex="-1"></main>
  <div id="cockpit-announcer" class="cockpit-visually-hidden" aria-live="polite" aria-atomic="true"></div>
  <noscript>Ce cockpit nécessite JavaScript pour ouvrir une session sécurisée.</noscript>
  <script src="./firebase-config.js?v=20260823-b65"></script>
  <script>
    (() => {
      const release = "20260823-b65";
      const releaseRank = (value) => {
        const match = /^(\d{8})-b(\d+)$/.exec(String(value || ""));
        return match ? [Number(match[1]), Number(match[2])] : null;
      };
      const isNewerRelease = (candidate) => {
        const next = releaseRank(candidate);
        const current = releaseRank(release);
        if (!candidate || candidate === release) return false;
        if (!next || !current) return true;
        return next[0] > current[0] || (next[0] === current[0] && next[1] > current[1]);
      };
      const requestRelease = (worker) => {
        try { worker?.postMessage?.({ type:"cockpit-release-request" }); } catch {}
      };
      const showUpdate = (nextRelease) => {
        const targetRelease = String(nextRelease || "").trim();
        if (!isNewerRelease(targetRelease)) return;
        const existing = document.querySelector("#cockpit-update-ready");
        if (existing) {
          existing.dataset.release = targetRelease;
          return;
        }
        const notice = document.createElement("aside");
        notice.id = "cockpit-update-ready";
        notice.dataset.release = targetRelease;
        notice.setAttribute("role", "status");
        notice.innerHTML = `<span>Une version plus récente du cockpit est prête.</span><button type="button">Actualiser maintenant</button>`;
        Object.assign(notice.style, { position:"fixed", left:"50%", bottom:"16px", transform:"translateX(-50%)", zIndex:"220", display:"flex", alignItems:"center", gap:"10px", width:"min(92vw,520px)", padding:"11px 14px", border:"1px solid #77b8c5", borderRadius:"14px", color:"#f7ffff", background:"#123f50", boxShadow:"0 12px 32px rgba(0,0,0,.28)", font:"600 .82rem/1.35 system-ui,sans-serif" });
        const button = notice.querySelector("button");
        Object.assign(button.style, { minHeight:"40px", padding:"7px 11px", border:"1px solid #b9e1e7", borderRadius:"9px", color:"#073a52", background:"#fff", font:"inherit", fontWeight:"800", cursor:"pointer" });
        button.addEventListener("click", () => {
          const target = notice.dataset.release || targetRelease;
          sessionStorage.setItem(`cockpit-shell-reload-${target}`, target);
          location.reload();
        });
        document.body.appendChild(notice);
      };
      if (!("serviceWorker" in navigator)) return;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        requestRelease(navigator.serviceWorker.controller);
      });
      navigator.serviceWorker.addEventListener("message", (event) => {
        if (!["cockpit-update-ready", "cockpit-release-info"].includes(event.data?.type)) return;
        const nextRelease = String(event.data?.release || "");
        if (!isNewerRelease(nextRelease)) return;
        const sessionIsOpen = Boolean(document.querySelector("#cockpit-session"));
        const reloadKey = `cockpit-shell-reload-${nextRelease}`;
        if (!sessionIsOpen && sessionStorage.getItem(reloadKey) !== nextRelease) {
          sessionStorage.setItem(reloadKey, nextRelease);
          location.reload();
          return;
        }
        showUpdate(nextRelease);
      });
      window.addEventListener("load", async () => {
        try {
          const registration = await navigator.serviceWorker.register("./sw.js", { scope: "./", updateViaCache: "none" });
          await registration.update();
          requestRelease(registration.waiting || navigator.serviceWorker.controller);
        } catch (error) {
          console.warn("Service worker indisponible", error);
        }
      });
    })();
  </script>
  <script type="module" src="./theme.js?v=20260823-b65"></script>
  <script type="module" src="./motion.js?v=20260823-b65"></script>
  <script type="module" src="./cockpit-ui.js?v=20260823-b65"></script>
  <script type="module" src="./view-mode.js?v=20260823-b65"></script>
</body>
</html>
