<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="clarity.css"><title>Validation V2 · test local</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui}.copy{white-space:pre-wrap}.cockpit-workflow-gates{display:grid;gap:10px}button{font:inherit}#test-note{padding:14px;background:#fff1da;color:#453221}#test-note a{padding:10px;display:inline-block}</style></head><body><script type="module">

import {installMediaValidationFixture} from './media-validation-test-fixture.mjs';
const [source,clientSource]=await Promise.all(['cockpit-ui.js','firebase-client.js'].map(path=>fetch(path).then(r=>r.text())));

workspace=mountWorkspace(api);
</script></body></html>
