<section id="fixture-login"><h1>Connexion de test</h1><p>Parcours local de l’adaptateur réel. Aucune connexion Firebase, aucun identifiant réel.</p><button id="fixture-connect">Se connecter (test local)</button></section>
<script type="module">
import {fixtureHTML,fixtures} from './workspace-test-fixture.mjs';
import {setupInterfaceSwitch,setupWorkspaceV2} from './workspace-adapter.js';
const role=new URLSearchParams(location.search).get('role')==='director'?'director':'admin';
document.querySelector('#fixture-connect').addEventListener('click',async()=>{
 document.querySelector('#fixture-login').remove();
 document.body.insertAdjacentHTML('afterbegin',fixtureHTML);

 const profile={uid:'local-test-only',role};
 const state={basePosts:fixtures,workflows:new Map(fixtures.map(p=>[p.id,{stage:'content_approved'}])),decisions:new Map(),mediaByEvent:new Map(),mediaDecisions:new Map()};
 await import('./theme.js');
 setupInterfaceSwitch(profile);
 await setupWorkspaceV2(profile,{state,enhanceCards(){},toast(message){const note=document.createElement('p');note.id='fixture-notice';note.textContent=message;document.body.prepend(note);},mediaPreview(){return ''}});
 document.body.dataset.entryReady='true';
});
</script></body></html>
