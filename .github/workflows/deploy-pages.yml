name: Publier le cockpit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      - name: Vérifier le contenu et le code
        run: |
          npm ci --prefix cockpit
          node --check finaliser_textes_publications.js
          node --check cockpit/plan-overrides.js
          node finaliser_textes_publications.js
          npm --prefix cockpit run seed -- --dry-run
          npm --prefix cockpit run test:contract
          npm --prefix cockpit run test:quality
          ! grep -q 'var posts=' cockpit/index.html
          git diff --exit-code
          npm --prefix cockpit run check
      - name: Vérifier l’absence de secrets locaux
        run: |
          ! git ls-files | grep -E '(^|/)(service-account[^/]*\.json|[^/]*-service-account[^/]*\.json|firebase-config\.local\.js)$'
          if git grep -n -E 'AIza[0-9A-Za-z_-]{20,}' -- ':!cockpit/firebase-config.js'; then
            echo 'Clé Google privée détectée dans le dépôt.'
            exit 1
          fi
          if git grep -n -E "GEMINI_API_KEY[[:space:]]*=[[:space:]]*['\"]?AIza" -- ':!*.md'; then
            echo 'Clé Gemini codée en dur détectée dans le dépôt.'
            exit 1
          fi
          if git grep -n -E -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|private_key_id[[:space:]]*[:=]|client_secret[[:space:]]*[:=]' -- ':!*.md'; then
            echo 'Secret privé ou clé de service détecté dans le dépôt.'
            exit 1
          fi
  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Préparer le site public
        run: |
          mkdir -p public
          cp cockpit/index.html public/
          cp cockpit/cockpit-ui.js public/
          cp cockpit/view-mode.js public/
          cp cockpit/view-mode.css public/
          cp cockpit/firebase-client.js public/
          cp cockpit/theme.js public/
          cp cockpit/firebase-config.js public/
          cp cockpit/manifest.webmanifest public/
          cp cockpit/sw.js public/
          cp cockpit/icon.svg public/
          cp cockpit/icons.svg public/
          cp SOURCES_ET_GARDES_FOUS.md public/
      - name: Préparer l’artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
